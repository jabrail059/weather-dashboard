services:
  dashboard:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/dashboard/Dockerfile
    container_name: dashboard
    environment:
      - HTTP_ADDR=:8081
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - HTTP_ALLOWED_ORIGINS=${HTTP_ALLOWED_ORIGINS}
      - POSTGRES_HOST=dashboard-postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - REDIS_ADDR=${REDIS_ADDR}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
      - GEOCODING_BASE_URL=${GEOCODING_BASE_URL}
      - FORECAST_BASE_URL=${FORECAST_BASE_URL}
      - IP_API_BASE_URL=${IP_API_BASE_URL}
      - TIME_ZONE=${TIME_ZONE}
      - LOGGER_FOLDER=/app/out/logs
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    depends_on:
      dashboard-redis:
        condition: service_healthy
      dashboard-postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    restart: always

  dashboard-postgres:
    image: postgres:18-bookworm
    container_name: dashboard-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  dashboard-redis:
    image: redis:7-alpine
    container_name: dashboard-env-redis
    environment:
      - REDIS_ADDR=${REDIS_ADDR}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
    volumes:
      - ${PROJECT_ROOT}/out/redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "ping"]
      start_period: 5s
      start_interval: 1s
      interval: 30s
      timeout: 3s
      retries: 5
    restart: always

  dashboard-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  postgres-port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: dashboard-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:dashboard-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"

  redis-port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: dashboard-redis-port-forwarder
    command: tcp-listen:6379,fork,reuseaddr tcp-connect:dashboard-redis:6379
    ports:
      - "127.0.0.1:6379:6379"

  swagger-gen:
    build:
      context: ${PROJECT_ROOT}
      dockerfile_inline: |
        FROM golang:1.25.6-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - ${PROJECT_ROOT}:/code