services:
  app:
    env_file:
      - .env
    image: jabrail059/weather-dashboard:latest
    ports:
      - "${APP_PORT}:8081"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/data
  redis:
    restart: always
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "ping"]
      start_period: 5s
      start_interval: 1s
      interval: 30s
      timeout: 3s
      retries: 5

volumes:
  redisdata: