<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101e38">
    <title>Почасовой прогноз — {{ .City }}</title>
    <link rel="icon" type="image/svg+xml" href="/static/icons/weather.svg">
    <link rel="stylesheet" href="/static/styles/style.css?v=8">
</head>
<body class="hourly-body">
    <main class="hourly-page">
        <div class="hourly-shell">
            <a href="/" class="inline-btn">← На главную</a>

            <header class="hourly-header">
                <span class="section-kicker">ПРОГНОЗ ПО ЧАСАМ</span>
                <h1 class="hourly-title">Каждый час под рукой.</h1>
                <div class="hourly-meta"><strong>{{ .City }}</strong><span class="hourly-dot"></span><span>{{ .Date }}</span></div>
            </header>

            <div class="daylight-row">
                <div class="daylight-chip sunrise"><img src="/static/icons/sunrise.svg" alt=""><span>Восход <strong>{{ .Sunrise }}</strong></span></div>
                <div class="daylight-chip sunset"><img src="/static/icons/sunset.svg" alt=""><span>Закат <strong>{{ .Sunset }}</strong></span></div>
            </div>

            {{template "hourly_base.html" .}}
        </div>
    </main>
</body>
</html>
