{{if .Presence}}
<section class="searchhistory">
    <div class="list-heading"><span class="list-heading-icon" aria-hidden="true">↺</span><h3>Недавно искали</h3></div>
    <div class="history-chips">
        {{range .Cities}}
        <span class="history-chip">{{ . }}</span>
        {{end}}
    </div>
</section>
{{end}}
